<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony Media Saver test page</title>
    <style>
      body { font-family: Segoe UI, system-ui, sans-serif; max-width: 720px; margin: 40px auto; color: #143033; }
      a { color: #01696f; }
      video, audio { width: 100%; margin: 12px 0 28px; }
    </style>
  </head>
  <body>
    <h1>Authorized test media</h1>
    <p>Serve this folder over http (run <code>npm run example</code> from the repository, then open <code>http://localhost:8080/test-media.html</code>), press play, then click Scan. Opening the file directly from disk (<code>file://</code>) is not scanned.</p>
    <h2>Sample video</h2>
    <video controls src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
    <p><a href="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">Direct MP4 link</a></p>
    <h2>Sample audio</h2>
    <audio controls src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"></audio>
  </body>
</html>
