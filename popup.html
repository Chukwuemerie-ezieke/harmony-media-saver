<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony Media Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Harmony Digital Consults</p>
          <h1>Media Saver</h1>
        </div>
        <div class="header-actions">
          <button id="scanButton" type="button" data-i18n="scan">Scan</button>
          <button id="optionsButton" type="button" data-i18n-title="openOptions" data-i18n-aria-label="openOptions" title="Options">⚙</button>
        </div>
      </header>

      <p id="status" role="status" data-i18n="checking">Checking this tab…</p>

      <nav class="filters" data-i18n-aria-label="filterLabel" aria-label="Filter media">
        <button type="button" data-filter="all" class="active" data-i18n="filterAll">All</button>
        <button type="button" data-filter="video" data-i18n="filterVideo">Video</button>
        <button type="button" data-filter="audio" data-i18n="filterAudio">Audio</button>
        <button type="button" data-filter="playlist" data-i18n="filterPlaylists">Playlists</button>
      </nav>

      <div class="batch" id="batchBar" hidden>
        <label class="select-all">
          <input id="selectAll" type="checkbox" />
          <span data-i18n="selectAll">Select all</span>
        </label>
        <button id="downloadSelected" type="button" disabled>Download selected (0)</button>
      </div>

      <section id="candidateList" aria-live="polite"></section>

      <footer>
        <button id="clearButton" type="button" data-i18n="clearList">Clear list</button>
        <span>
          <span data-i18n="authorizedOnly">Only save media you are authorized to download.</span>
          <a id="helpLink" href="welcome.html#nothing" target="_blank" data-i18n="whyNothing">Why is nothing showing?</a>
        </span>
      </footer>
    </main>
    <script src="shared.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
