name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package (manifest, files, icons, syntax)
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build store package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error
