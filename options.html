<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony Media Saver Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Harmony Digital Consults</p>
        <h1>Media Saver options</h1>
        <p>These settings stay on this computer. The extension never uploads your browsing data.</p>
      </header>

      <form id="settingsForm">
        <label>
          Download folder name
          <input id="folderName" name="folderName" maxlength="80" required />
        </label>

        <label class="check">
          <input id="saveAs" name="saveAs" type="checkbox" />
          Ask where to save each file
        </label>

        <label class="check">
          <input id="showPlaylists" name="showPlaylists" type="checkbox" />
          Show streaming playlists as unsupported items
        </label>

        <label>
          Maximum items remembered per tab
          <input id="maxCandidates" name="maxCandidates" type="number" min="5" max="100" />
        </label>

        <label>
          Blocked hosts (one per line)
          <textarea id="blockedHosts" rows="8" spellcheck="false"></textarea>
        </label>

        <label>
          Allowlist hosts (optional, one per line)
          <textarea id="allowlistHosts" rows="5" spellcheck="false" placeholder="learn.yourschool.edu.ng"></textarea>
          <small>If this list is not empty, only these hosts are scanned.</small>
        </label>

        <div class="actions">
          <button type="submit">Save settings</button>
          <button id="resetButton" type="button">Restore defaults</button>
        </div>
        <p id="saveStatus" role="status"></p>
      </form>

      <section>
        <div class="section-head">
          <h2>Local download history</h2>
          <button id="clearHistoryButton" type="button">Clear history</button>
        </div>
        <ul id="historyList"></ul>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
